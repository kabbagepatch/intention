<!doctype html>
<html lang="en" style=" background: transparent; ">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container" style=" padding: 0; ">
      <div id="stars" style="opacity: 0.4;"></div>
      <div data-tauri-drag-region class="widget-container" id="widget-container">
        <div data-tauri-drag-region class="widget-container-inner">
          <div class="timer-container">
            <svg class="timer-svg" viewBox="0 0 100 100">
              <circle class="timer-bg" cx="50" cy="50" r="40" />
              <circle class="timer-progress" id="progress-circle" cx="50" cy="50" r="40" />
            </svg>
            <div class="timer-inner">
              <div data-tauri-drag-region id="timer-text"><span id="timer-hours">0</span>:<span id="timer-minutes">10</span></div>
              <button class="icon-button" id="snooze-button">
                <svg id="snooze-icon" fill="#000000" viewBox="0 0 24 24">
                  <path d="M9.5,20h4a2,2,0,0,1-4,0Zm10-11H17.914l2.293-2.293A1,1,0,0,0,19.5,5h-4a1,1,0,0,0,0,2h1.586L14.793,9.293A1,1,0,0,0,15.5,11h4a1,1,0,0,0,0-2Zm-2,4h-2a3,3,0,0,1-2.235-5,2.974,2.974,0,0,1-.184-3.757A5.969,5.969,0,0,0,12.5,4.09V3a1,1,0,0,0-2,0V4.09A6,6,0,0,0,5.5,10v6l-2,2h16l-2-2Z"/>
                </svg>
              </button>
              <button class="icon-button" id="next-button">
                <svg id="next-icon" viewBox="0 0 24 24" fill="#000000">
                  <path
                    d="M3.76172 7.21957V16.7896C3.76172 18.7496 5.89172 19.9796 7.59172 18.9996L11.7417 16.6096L15.8917 14.2096C17.5917 13.2296 17.5917 10.7796 15.8917 9.79957L11.7417 7.39957L7.59172 5.00957C5.89172 4.02957 3.76172 5.24957 3.76172 7.21957Z"
                  />
                  <path
                    d="M20.2383 18.9303C19.8283 18.9303 19.4883 18.5903 19.4883 18.1803V5.82031C19.4883 5.41031 19.8283 5.07031 20.2383 5.07031C20.6483 5.07031 20.9883 5.41031 20.9883 5.82031V18.1803C20.9883 18.5903 20.6583 18.9303 20.2383 18.9303Z"
                  />
                </svg>
              </button>
            </div>
          </div>
          <h1 data-tauri-drag-region id="widget-title"></h1>
        </div>
        <button class="icon-button" id="back-button">
          <svg id="back-icon" viewBox="0 0 1024 1024" fill="#000000">
            <path
              d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z"
            />
            <path
              d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z"
            />
          </svg>
        </button>
      </div>
    </main>
  </body>
</html>
